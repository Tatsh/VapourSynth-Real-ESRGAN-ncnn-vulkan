[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27.0,!=1.32.3", "meson>=1.3.0", "ninja>=1.11.0", "packaging>=25.0"]

[dependency-groups]
dev = [
  "commitizen>=4.18.1",
  "cz-path>=0.0.7",
  "mypy>=2.3.1",
  "ruff==0.16.8",
  "ty>=0.0.82",
  "hatchling>=1.27.0,!=1.32.3",
  "meson>=1.3.0",
  "ninja>=1.11.0",
]
docs = [
  "autodoc-pydantic>=2.2.0",
  "doc8>=2.0.0",
  "enum-tools[sphinx]>=0.13.0",
  "esbonio>=2.1.0",
  "restructuredtext-lint>=2.0.2",
  "sphinx-datatables>=1.0.0",
  "sphinx-immaterial>=0.13.9",
  "sphinx>=9.1.0; python_version >= \"3.13\"",
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = ["vapoursynth>=75"]
description = "Real-ESRGAN super-resolution plugin for VapourSynth (ncnn Vulkan backend)."
keywords = ["plugin", "vapoursynth"]
license = "MIT"
name = "vapoursynth-real-esrgan-ncnn-vulkan"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.1.0"

[[project.authors]]
email = "audvare@gmail.com"
name = "Andrew Udvare"

[[project.authors]]
email = "xintao.wang@outlook.com"
name = "Xintao Wang"

[project.urls]
Issues = "https://github.com/Tatsh/vapoursynth-real-esrgan-ncnn-vulkan/issues"
documentation = "https://vapoursynth-real-esrgan-ncnn-vulkan.readthedocs.org"
homepage = "https://tatsh.github.io/vapoursynth-real-esrgan-ncnn-vulkan/"
repository = "https://github.com/Tatsh/vapoursynth-real-esrgan-ncnn-vulkan"

[tool.commitizen]
name = "cz_path"
remove_path_prefixes = ["include", "src"]
tag_format = "v$version"
version_files = [
  ".wiswa.jsonnet",
  "CITATION.cff",
  "README.md",
  "docs/badges.rst",
  "docs/index.rst",
  "package.json",
  "meson.build",
]
version_provider = "pep621"

[tool.doc8]
max-line-length = 100

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE.txt",
  "/README.md",
  "/hatch_build.py",
  "/meson.build",
  "/meson.options",
  "/pyproject.toml",
  "/src",
  "/tools",
]

[tool.hatch.build.targets.wheel]
artifacts = ["vapoursynth/plugins/*.dll", "vapoursynth/plugins/*.dylib", "vapoursynth/plugins/*.so"]
include = ["/vapoursynth/plugins"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.mypy]
cache_dir = "~/.cache/mypy"
exclude = "src/ncnn"
explicit_package_bases = true
platform = "linux"
python_version = "3.12"
show_column_numbers = true
strict = true
strict_optional = true
warn_unreachable = true

[tool.pyright]
deprecateTypingAliases = true
enableExperimentalFeatures = true
exclude = [".sbclaude-venv", ".venv", "**/node_modules", "**/__pycache__", "**/.*", "src/ncnn/**"]
include = []
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportCallInDefaultInitializer = "warning"
reportImplicitOverride = "warning"
reportImportCycles = "error"
reportMissingModuleSource = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryTypeIgnoreComment = "none"
typeCheckingMode = "off"
venv = ".venv"
venvPath = "."

[tool.ruff]
cache-dir = "~/.cache/ruff"
exclude = ["src/ncnn"]
force-exclude = true
line-length = 100
namespace-packages = ["docs", "tools"]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
quote-style = "single"

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "bad-quotes-inline-string",
  "avoidable-escaped-quote",
  "any-type",
  "error-suffix-on-exception-name",
  "incorrect-blank-line-after-class",
  "incorrect-blank-line-before-class",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-trailing-comma",
  "multi-line-summary-first-line",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
]
preview = true

[tool.ruff.lint.flake8-builtins]
allowed-modules = ["types", "typing"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
from-first = true
known-first-party = []
required-imports = ["from __future__ import annotations"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["test_*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 20
max-locals = 20
max-positional-args = 15
max-public-methods = 30
max-returns = 10
max-statements = 100

[tool.ty.src]
exclude = ["src/ncnn"]

[tool.uv]
default-groups = "all"
exclude-newer = "1 week"
