jobs:
  build-linux:
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.arch.runner }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools glslang-dev zip
          python -m pip install --upgrade meson
      - name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build -j "$(nproc)"
          cmake --install ncnn-build
      # Ubuntu ships no SPIRV-Tools library, but glslang links against it,
      # so build it from source into the system prefix.
      - name: 'Build SPIRV-Tools'
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Headers spirv-headers
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Tools spirv-tools
          cmake -S spirv-tools -B spirv-tools-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=OFF \
            -DSPIRV-Headers_SOURCE_DIR="${GITHUB_WORKSPACE}/spirv-headers" \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build spirv-tools-build -j "$(nproc)"
          sudo cmake --install spirv-tools-build
      # No VapourSynth is installed here, so the build downloads VapourSynth4.h
      # and VSHelper4.h itself. This exercises the same path the wheel builds take.
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install;${{ github.workspace }}/VulkanSDK'
        name: 'Configure'
        run: >-
          meson setup build --buildtype '${{ matrix.build-type }}'
          --prefix /usr
      - name: 'Build'
        run: 'meson compile -C build --verbose'
      - env:
          ARCH: '${{ matrix.arch.suffix }}'
        name: 'Package'
        run: |
          version=$(meson introspect --projectinfo build | jq -r '.version')
          meson install -C build --destdir "${GITHUB_WORKSPACE}/stage"
          (cd stage && zip -r "${GITHUB_WORKSPACE}/realesrgan-${version}-linux-${ARCH}.zip" .)
      - name: 'Upload artefacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'realesrgan-${{ matrix.build-type }}-linux-${{ matrix.arch.suffix }}'
          path: '${{ github.workspace }}/realesrgan-*-linux-*.zip'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: 'ubuntu-latest'
            suffix: 'x86_64'
          - runner: 'ubuntu-24.04-arm'
            suffix: 'arm64'
        build-type: ['debug', 'release']
  build-macos:
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.os.runner }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: |
          brew install cmake ninja vulkan-headers vulkan-loader glslang
          python -m pip install --upgrade meson
      - name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build -j "$(sysctl -n hw.ncpu)"
          cmake --install ncnn-build
      # No VapourSynth is installed here, so the build downloads VapourSynth4.h
      # and VSHelper4.h itself. This exercises the same path the wheel builds take.
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install;${{ github.workspace }}/VulkanSDK'
        name: 'Configure'
        run: >-
          meson setup build --buildtype '${{ matrix.build-type }}'
          --prefix /usr/local
      - name: 'Build'
        run: 'meson compile -C build --verbose'
      - env:
          ARCH: '${{ matrix.os.suffix }}'
        name: 'Package'
        run: |
          version=$(meson introspect --projectinfo build | jq -r '.version')
          meson install -C build --destdir "${GITHUB_WORKSPACE}/stage"
          (cd stage && zip -r "${GITHUB_WORKSPACE}/realesrgan-${version}-macos-${ARCH}.zip" .)
      - name: 'Upload artefacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'realesrgan-${{ matrix.build-type }}-macos-${{ matrix.os.suffix }}'
          path: '${{ github.workspace }}/realesrgan-*-macos-*.zip'
    strategy:
      fail-fast: false
      matrix:
        build-type: ['debug', 'release']
        os:
          - runner: 'macos-latest'
            suffix: 'arm64'
          - runner: 'macos-15-intel'
            suffix: 'x86_64'
  build-windows:
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.sys.runner }}'
    env:
      BUILD_TYPE: ${{ matrix.build-type == 'debug' && 'Debug' || 'Release' }}
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: 'python -m pip install --upgrade meson ninja'
      - name: 'Vulkan SDK'
        run: |
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanSDK-1.4.309.0-Installer.exe?Human=true -OutFile VulkanSDK-1.4.309.0-Installer.exe
          7z x -aoa ./VulkanSDK-1.4.309.0-Installer.exe -oVulkanSDK
          $prune = 'Demos', 'Samples', 'Third-Party', 'Tools', 'Tools32', 'Bin32', 'Lib32' |
            ForEach-Object { ".\VulkanSDK\$_" } | Where-Object { Test-Path $_ }
          if ($prune) { Remove-Item $prune -Recurse }
          if (!(Test-Path .\VulkanSDK\Bin\glslangValidator.exe)) { throw 'glslangValidator.exe missing from extracted SDK' }
          "PATH=$env:GITHUB_WORKSPACE/VulkanSDK/Bin;$env:PATH" >> $env:GITHUB_ENV
      - env:
          VULKAN_SDK: '${{ github.workspace }}/VulkanSDK'
        name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/ncnn-install" `
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF `
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build --config $env:BUILD_TYPE --parallel
          cmake --install ncnn-build --config $env:BUILD_TYPE
      # The Windows SDK ships no SPIRV-Tools library, but glslang links
      # against it, so build it from source into the shared prefix.
      - name: 'Build SPIRV-Tools'
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Headers spirv-headers
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Tools spirv-tools
          cmake -S spirv-tools -B spirv-tools-build -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/ncnn-install" `
            -DSPIRV-Headers_SOURCE_DIR="$($env:GITHUB_WORKSPACE -replace '\\','/')/spirv-headers" `
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build spirv-tools-build --config $env:BUILD_TYPE --parallel
          cmake --install spirv-tools-build --config $env:BUILD_TYPE
      # --vsenv activates the Visual Studio environment, so no separate MSVC
      # setup action is needed. -Db_vscrt=mt matches the shipped wheels.
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install;${{ github.workspace }}/VulkanSDK'
          VULKAN_SDK: '${{ github.workspace }}/VulkanSDK'
        name: 'Configure'
        run: >-
          meson setup build --vsenv --buildtype
          ${{ matrix.build-type }}
      - name: 'Build'
        run: 'meson compile -C build --verbose'
      # Windows users extract the zip straight into their VapourSynth plugin
      # directory, so it is flat rather than an installed prefix tree.
      - name: 'Package'
        run: |
          $version = (meson introspect --projectinfo build | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/src/*.dll stage/
          Copy-Item LICENSE, LICENSE.txt, README.md stage/
          $name = "realesrgan-$version-windows-${{ matrix.sys.arch }}.zip"
          Compress-Archive -Path stage/* -DestinationPath $name -Force
      - name: 'Upload artefacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'realesrgan-${{ matrix.build-type }}-windows-${{ matrix.sys.arch }}'
          path: '${{ github.workspace }}/realesrgan-*-windows-*.zip'
    strategy:
      fail-fast: false
      matrix:
        build-type: ['debug', 'release']
        sys:
          - arch: 'x86_64'
            runner: 'windows-latest'
          - arch: 'arm64'
            runner: 'windows-11-arm'
name: 'Meson'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
permissions: {}
