# Hand-maintained Publish workflow: builds an sdist plus one wheel per
# OS/CPU combination (via direct runners, since the Vulkan and ncnn
# dependencies do not fit in cibuildwheel containers) and publishes them
# all to PyPI in a single job. A Wiswa regen overwrites this file with the
# single-wheel template; restore this version afterwards.
jobs:
  check:
    permissions:
      actions: 'read'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          COMMIT_SHA: '${{ github.sha }}'
          GH_TOKEN: '${{ github.token }}'
        id: 'check'
        name: 'Wait for workflows'
        run: |
          sha="$COMMIT_SHA"
          required_workflows=('Meson')
          optional_workflows=('Prettier' 'QA' 'Spelling' 'markdownlint')
          process_workflow() {
            local workflow="$1" treat_missing="$2"
            local run status conclusion
            run=$(gh run list --workflow "$workflow" --commit "$sha" --json status,conclusion --jq '.[0]') || run=''
            if [[ -z "$run" || "$run" == 'null' ]]; then
              if [[ "$treat_missing" == 'pending' ]]; then
                echo "Required workflow '$workflow' has not registered a run yet; waiting."
                return 2
              fi
              echo "Optional workflow '$workflow' did not run for this commit; skipping."
              return 0
            fi
            status=$(echo "$run" | jq -r '.status') || status=''
            conclusion=$(echo "$run" | jq -r '.conclusion') || conclusion=''
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '$workflow' ${conclusion}."
                return 1
                ;;
              success|skipped|neutral)
                return 0
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '$workflow' completed with unexpected conclusion '${conclusion}'."
                  return 1
                fi
                echo "Workflow '$workflow' still pending (status=${status})."
                return 2
                ;;
            esac
          }
          for i in $(seq 1 30); do
            all_done=true
            for workflow in "${required_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" pending || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            for workflow in "${optional_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" skip || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            if [[ "$all_done" == 'true' ]]; then
              echo 'All required workflows succeeded.'
              exit 0
            fi
            echo "Waiting 60s for workflows to complete (attempt ${i}/30)..."
            sleep 60
          done
          echo '::error::Timed out waiting for workflows.'
          exit 1
  build-sdist:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install uv'
        uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7'
        with:
          enable-cache: false
      - name: 'Build sdist'
        run: 'uv build --sdist'
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'sdist'
          path: 'dist/*.tar.gz'
  build-wheels-linux:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.arch.runner }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools glslang-dev
          python -m pip install --upgrade meson
      - name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build -j "$(nproc)"
          cmake --install ncnn-build
      # Ubuntu ships no SPIRV-Tools library, but glslang links against it,
      # so build it from source into the system prefix.
      - name: 'Build SPIRV-Tools'
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Headers spirv-headers
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Tools spirv-tools
          cmake -S spirv-tools -B spirv-tools-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=OFF \
            -DSPIRV-Headers_SOURCE_DIR="${GITHUB_WORKSPACE}/spirv-headers" \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build spirv-tools-build -j "$(nproc)"
          sudo cmake --install spirv-tools-build
      - uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7'
        with:
          enable-cache: false
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install;${{ github.workspace }}/VulkanSDK'
          REALESRGAN_MESON_SETUP_ARGS: '--buildtype release'
          REALESRGAN_REQUIRE_NATIVE: '1'
        name: 'Build wheel'
        run: 'uv build --wheel'
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'wheels-linux-${{ matrix.arch.suffix }}'
          path: 'dist/*.whl'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runner: 'ubuntu-latest'
            suffix: 'x86_64'
          - runner: 'ubuntu-24.04-arm'
            suffix: 'aarch64'
  build-wheels-macos:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.os.runner }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: |
          brew install cmake ninja vulkan-headers vulkan-loader glslang
          python -m pip install --upgrade meson
      - name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build -j "$(sysctl -n hw.ncpu)"
          cmake --install ncnn-build
      - uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7'
        with:
          enable-cache: false
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install'
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          REALESRGAN_MESON_SETUP_ARGS: '--buildtype release'
          REALESRGAN_REQUIRE_NATIVE: '1'
        name: 'Build wheel'
        run: 'uv build --wheel'
      # Homebrew links glslang (and the Vulkan loader) as shared libraries;
      # vendor them into the wheel so it loads without Homebrew installed.
      # delocate-wheel rewrites the wheels in place.
      - env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        name: 'Bundle macOS dependencies'
        run: |
          python -m pip install delocate
          delocate-wheel --require-archs '${{ matrix.os.suffix }}' dist/*.whl
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'wheels-macos-${{ matrix.os.suffix }}'
          path: 'dist/*.whl'
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: 'macos-15'
            suffix: 'arm64'
          - runner: 'macos-15-intel'
            suffix: 'x86_64'
  build-wheels-windows:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.sys.runner }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # Shallow submodule checkout: full ncnn history is over 1 GB.
      - name: 'Checkout submodules'
        run: 'git submodule update --init --depth 1 --recursive src/ncnn'
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install dependencies'
        run: 'python -m pip install --upgrade meson ninja'
      - name: 'Vulkan SDK'
        run: |
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanSDK-1.4.309.0-Installer.exe?Human=true -OutFile VulkanSDK-1.4.309.0-Installer.exe
          7z x -aoa ./VulkanSDK-1.4.309.0-Installer.exe -oVulkanSDK
          $prune = 'Demos', 'Samples', 'Third-Party', 'Tools', 'Tools32', 'Bin32', 'Lib32' |
            ForEach-Object { ".\VulkanSDK\$_" } | Where-Object { Test-Path $_ }
          if ($prune) { Remove-Item $prune -Recurse }
          if (!(Test-Path .\VulkanSDK\Bin\glslangValidator.exe)) { throw 'glslangValidator.exe missing from extracted SDK' }
          "PATH=$env:GITHUB_WORKSPACE/VulkanSDK/Bin;$env:PATH" >> $env:GITHUB_ENV
      - env:
          VULKAN_SDK: '${{ github.workspace }}/VulkanSDK'
        name: 'Build ncnn'
        run: |
          cmake -S src/ncnn -B ncnn-build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/ncnn-install" `
            -DNCNN_VULKAN=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_EXAMPLES=OFF `
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_SYSTEM_GLSLANG=ON
          cmake --build ncnn-build --config Release -j $env:NUMBER_OF_PROCESSORS
          cmake --install ncnn-build --config Release
      # The Windows SDK ships no SPIRV-Tools library, but glslang links
      # against it, so build it from source into the shared prefix.
      - name: 'Build SPIRV-Tools'
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Headers spirv-headers
          git clone --depth 1 --branch vulkan-sdk-1.4.321.0 https://github.com/KhronosGroup/SPIRV-Tools spirv-tools
          cmake -S spirv-tools -B spirv-tools-build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/ncnn-install" `
            -DSPIRV-Headers_SOURCE_DIR="$($env:GITHUB_WORKSPACE -replace '\\','/')/spirv-headers" `
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON
          cmake --build spirv-tools-build --config Release -j $env:NUMBER_OF_PROCESSORS
          cmake --install spirv-tools-build --config Release
      - uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7'
        with:
          enable-cache: false
      - env:
          CMAKE_PREFIX_PATH: '${{ github.workspace }}/ncnn-install;${{ github.workspace }}/VulkanSDK'
          REALESRGAN_MESON_SETUP_ARGS: '--buildtype release'
          REALESRGAN_REQUIRE_NATIVE: '1'
          VULKAN_SDK: '${{ github.workspace }}/VulkanSDK'
        name: 'Build wheel'
        run: 'uv build --wheel'
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'wheels-windows-${{ matrix.sys.arch }}'
          path: 'dist/*.whl'
    strategy:
      fail-fast: false
      matrix:
        sys:
          - arch: 'x86_64'
            runner: 'windows-latest'
          - arch: 'arm64'
            runner: 'windows-11-arm'
  publish:
    environment: 'release'
    needs:
      - 'build-sdist'
      - 'build-wheels-linux'
      - 'build-wheels-macos'
      - 'build-wheels-windows'
    permissions:
      actions: 'read'
      contents: 'write'
      id-token: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          merge-multiple: true
          path: 'dist'
          pattern: 'wheels-*'
      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          name: 'sdist'
          path: 'dist'
      - uses: 'pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33'
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.sha }}'
        name: 'Download the Windows zips from the Meson run'
        run: |
          run_id=$(gh run list --workflow Meson --commit "$HEAD_SHA" \
            --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          mkdir -p zips
          if [[ -n "$run_id" && "$run_id" != 'null' ]]; then
            gh run download "$run_id" --pattern 'realesrgan-release-windows-*' --dir zips
          fi
      - env:
          GH_TOKEN: '${{ github.token }}'
        name: 'Create or update draft release'
        run: |
          mapfile -t zips < <(find zips -name '*.zip')
          gh release create "$GITHUB_REF_NAME" --draft --notes '' dist/*.tar.gz dist/*.whl "${zips[@]}" ||
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl "${zips[@]}" --clobber
name: 'Publish'
'on':
  push:
    tags:
      - 'v*'
permissions: {}
